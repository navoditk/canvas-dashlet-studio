name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Verify generated tool schemas are up to date
        run: uv run python scripts/generate_tool_schemas.py --check

  extension:
    name: Canvas extension (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/extensions/dashlet-studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm test
        run: npm test
