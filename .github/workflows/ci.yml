name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      # Formatting had no gate, so 29 files had drifted with nothing to catch
      # it. Scoped to Python rather than the whole tree on purpose: ruff also
      # formats Python inside markdown fences, and docs/DASHLET_CONTRACT.md
      # illustrates a route decorator with the fragment
      # `responses={...},` -- which ruff parses as a statement and rewrites
      # into `responses = (...)`, a tuple assignment that is valid Python and
      # wrong documentation. Teaching examples are authored, not generated.
      - name: Ruff format
        run: uv run ruff format --check . --exclude "*.md"

      - name: Pytest
        run: uv run pytest

      - name: Verify generated tool schemas are up to date
        run: uv run python scripts/generate_tool_schemas.py --check

      - name: Documentation links and anchors
        run: uv run python scripts/check_doc_links.py

  extension:
    name: Canvas extension (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/extensions/dashlet-studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm test
        run: npm test
